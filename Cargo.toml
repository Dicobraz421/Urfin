[profile.release.package.icu_normalizer]
opt-level = "z"
[profile.release.package.icu_properties]
opt-level = "z"
[profile.release.package.icu_collections]
opt-level = "z"
[profile.release.package.icu_provider]
opt-level = "z"
[profile.release.package.icu_locale_core]
opt-level = "z"
[profile.release.package.tracing-subscriber]
opt-level = "z"
[profile.release.package.chrono]
opt-level = "z"
[profile.release.package.time]
opt-level = "z"
[profile.release.package.smol]
opt-level = "z"
[profile.release.package.async-process]
opt-level = "z"
[profile.release.package.async-net]
