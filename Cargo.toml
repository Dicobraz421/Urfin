# Цветовые профили картинок, тесселяция путей, разбор regex и SVG-типов, ICU-нормализация:
# не на горячем пути кадра (бинарь ≤ 25 МБ, №54; D-04 — 25,06).
[profile.release.package.moxcms]
opt-level = "z"
[profile.release.package.pxfm]
opt-level = "z"
[profile.release.package.lyon_tessellation]
opt-level = "z"
[profile.release.package.lyon_path]
opt-level = "z"
[profile.release.package.lyon_geom]
opt-level = "z"
[profile.release.package.lyon_algorithms]
opt-level = "z"
[profile.release.package.regex-syntax]
