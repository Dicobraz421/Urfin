[profile.release.package.unic-langid-impl]
opt-level = "z"
[profile.release.package.icu_normalizer_data]
opt-level = "z"
[profile.release.package.icu_properties_data]
opt-level = "z"

# Гигиена диска (H-01): в стектрейсах — файл и строка, PDB в разы меньше.
[profile.dev]
debug = "line-tables-only"

# Быстрые зависимости в debug, без их отладочных символов (H-01).
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

[patch.crates-io]
# Windows-платформа gpui с патчами Pets (ADR-0018, G-02; pets/crates/pets-gpui-windows):
# кадры по запросу — поток vsync спит без запросов кадра (0 % CPU в простое), живой
# ресайз (новая область до кадра — фоном окна, не чёрной), шейдеры в exe байткодом
# (компиляция при сборке), принудительный WARP (`GPUI_FORCE_WARP=1`), поток vsync будится
# с новым окном, ленивые текстуры путей. Обновлять вместе с gpui-kit.
gpui-pre-windows = { git = "https://github.com/Dicobraz421/pets", rev = "a280d8587d91c2b90a06499b29247f4d300dd740" }
