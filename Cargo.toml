[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Anton Antropov"]
repository = "https://github.com/Dicobraz421/Urfin"

[workspace.dependencies]
# Крейты workspace. Рёбра между ними заводит задача, которая начинает их использовать.
urfin-core = { path = "crates/core", version = "0.1.0" }
urfin-vfs = { path = "crates/vfs", version = "0.1.0" }
urfin-ops = { path = "crates/ops", version = "0.1.0" }
urfin-term = { path = "crates/term", version = "0.1.0" }
urfin-keymap = { path = "crates/keymap", version = "0.1.0" }
urfin-view = { path = "crates/view", version = "0.1.0" }
urfin-ui = { path = "crates/ui", version = "0.1.0" }
urfin-i18n = { path = "crates/i18n", version = "0.1.0" }
urfin-search = { path = "crates/search", version = "0.1.0" }
urfin-arc = { path = "crates/arc", version = "0.1.0" }
urfin-net = { path = "crates/net", version = "0.1.0" }
urfin-testdata = { path = "crates/testdata" }

# Внешние зависимости (S1 §3).
# -EncodedCommand интеграции PowerShell (S6-11); MIT/Apache-2.0, уже в дереве (gpui).
base64 = "0.22.1"
ecolor = { version = "0.37.0", default-features = false }
# UI на GPUI (ADR-0018): gpui-kit = снимок Zed `gpui-pre`, версия фиксирована.
gpui-kit = "=0.7.3"
# Сигнал воркеров Core в цикл GPUI (уже в графе через gpui).
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
crossbeam-channel = "0.5.17"
# VT-эмуляция терминала (S6 §0): только `Term` и `vte::ansi::Processor`; API 0.x — версия точно.
alacritty_terminal = { version = "=0.26.0", default-features = false }
rayon = "1.12"
compact_str = { version = "0.10", features = ["serde"] }
smallvec = { version = "1.16", features = ["serde", "union", "const_generics"] }
rustc-hash = "2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# preserve_order: порядок строк keymap важен (S3 §2.4) — для всех крейтов одинаково.
toml = { version = "1.1", features = ["preserve_order"] }
# Запись настроек из UI с комментариями (S2-22); та же версия уже в графе (proc-macro gpui).
toml_edit = "0.25"
dirs = "7.0"
thiserror = "2.0"
# Модификаторы клавиш keymap (S3 §5).
bitflags = "2.13"
anyhow = "1.0"
# Уже в графе через dirs и tracing-subscriber; features — в крейтах.
windows-sys = "0.61"
# HWND окна gpui (subclass записок клавиш, S3-07); уже в графе через gpui.
raw-window-handle = "0.6"
# statvfs в vfs (unix); S6 — PTY (S0 v3 «Зависимости»).
rustix = { version = "1.1", default-features = false, features = ["std"] }
# VERSIONINFO exe (R-01): без `toml` — поля задаёт build.rs.
winresource = { version = "0.1.34", default-features = false }
# Без `attributes` (#[instrument]): тянет syn 2 рядом с syn 3. Спаны — через `*_span!`.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Без `env-filter`: фильтр — `filter::Targets`, regex не нужен (размер бинаря).
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
tracing-appender = "0.2.5"
# i18n (S2 §8; решение владельца 2026-10-17 — sys-locale, jiff).
fluent-bundle = "0.16"
# Только dev: AST для линтов parity.
fluent-syntax = "0.12"
unic-langid = "0.9.6"
sys-locale = "0.3.2"
jiff = "0.2.38"
# urfin-net (F03 §2.1, запрос №4): один current-thread рантайм на крейт; уже в графе (gpui).
tokio = { version = "1.53", default-features = false }
# Сеансы PuTTY из HKCU (F03 §2.2) без `unsafe`; MIT/Apache-2.0, уже в графе (gpui, Windows).
windows-registry = "0.6"

# Только dev.
proptest = "1.12"
tempfile = "3.27"
insta = { version = "1.49", features = ["toml"] }
criterion = "0.8"

[workspace.lints.rust]
# `#[allow(unsafe_code)]` получают только модули `sys` в vfs, ops, term, ui, view, app (S0 v4 №1, v5 №5).
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "unwind"

# Холодный код — по размеру (`z`: без векторизации циклов, бинарь ≤ 25 МБ, №54): компилятор шейдеров (раз на старте),
# разбор TOML/Fluent/зон (конфиг, строки), JSON сессии.
[profile.release.package.toml_parser]
opt-level = "z"
[profile.release.package.toml_edit]
opt-level = "z"
[profile.release.package.toml]
opt-level = "z"
[profile.release.package.fluent-bundle]
opt-level = "z"
[profile.release.package.fluent-syntax]
opt-level = "z"
[profile.release.package.serde_json]
opt-level = "z"

# Декодеры изображений и SVG, Markdown/HTML из gpui (ADR-0018): в файловом
# менеджере не на горячем пути — по размеру (бюджет бинаря 25 МБ, №54).
[profile.release.package.image]
