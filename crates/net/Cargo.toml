[package]
name = "urfin-net"
description = "Urfin SSH and SFTP: profiles, connections, sftp:// VFS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
dirs.workspace = true
futures.workspace = true
hmac.workspace = true
russh.workspace = true
serde.workspace = true
sha1.workspace = true
shell-words.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util", "macros"] }
toml.workspace = true
tracing.workspace = true
urfin-core.workspace = true
urfin-i18n.workspace = true
# `proc::spawn_piped` — команда менеджера паролей, `ssh -V` (v6 №15).
urfin-term.workspace = true
zeroize.workspace = true

# Сеансы PuTTY (F03 §2.2); Диспетчер учётных данных и pipe моста (F03 §2.5, §2.7).
[target.'cfg(windows)'.dependencies]
keyring.workspace = true
windows-registry.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
] }

[dev-dependencies]
base64.workspace = true
insta.workspace = true
proptest.workspace = true
russh-sftp.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "net", "io-util", "macros"] }

[lints]
workspace = true
