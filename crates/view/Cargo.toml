[package]
name = "urfin-view"
description = "Urfin viewer and editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
urfin-core.workspace = true
urfin-vfs.workspace = true
urfin-i18n.workspace = true
chardetng.workspace = true
compact_str.workspace = true
crossbeam-channel.workspace = true
encoding_rs.workspace = true
memchr.workspace = true
memmap2.workspace = true
pulldown-cmark.workspace = true
rayon.workspace = true
regex-automata.workspace = true
regex-cursor.workspace = true
regex-syntax.workspace = true
ropey.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

# `ReplaceFileW`, `GetFileInformationByHandle` — только `view::sys` (S7 §1).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true
# Пресеты far/dn против команд вьювера и редактора.
urfin-keymap.workspace = true

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "index"
harness = false

[[bench]]
name = "layout"
harness = false

[[bench]]
name = "search"
harness = false

[lints]
workspace = true
