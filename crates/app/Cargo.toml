[package]
name = "urfin-app"
description = "Urfin: fast dual-pane file manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "urfin"
path = "src/main.rs"

[features]
# Диагностика (S2-20, S0 v5 №11): счётчик аллокаций для `--bench`; в release запрещена
# (`ci/release_features.py`).
count-alloc = []

[dependencies]
anyhow.workspace = true
# FakeListing: настоящий листинг ФС — S4.
urfin-core = { workspace = true, features = ["fake"] }
urfin-i18n.workspace = true
urfin-keymap.workspace = true
urfin-net.workspace = true
urfin-ops.workspace = true
urfin-pkg.workspace = true
urfin-term.workspace = true
urfin-ui.workspace = true
urfin-vfs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Ресурсы exe (ProductName, CompanyName) — build.rs, только при сборке под Windows.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
