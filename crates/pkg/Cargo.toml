[package]
name = "urfin-pkg"
description = "Urfin package managers: winget, scoop, choco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
bitflags = { workspace = true, features = ["serde"] }
compact_str = { workspace = true, features = ["serde"] }
# Вывод менеджеров: UTF-8, иначе OEM-кодовая страница (F02 §2.3).
encoding_rs.workspace = true
oem_cp.workspace = true
# `checked_at` в `check.json` — RFC 3339 (F02 §4).
jiff = { workspace = true, features = ["serde"] }
serde.workspace = true
thiserror.workspace = true
# Кэш `managers.toml` (F02 §2.2).
toml.workspace = true
tracing.workspace = true

urfin-core.workspace = true
urfin-i18n.workspace = true

[target.'cfg(windows)'.dependencies]
# Процессы с пайпами и job object (`term::proc`, S0 v6 №15).
urfin-term.workspace = true
# ARP и `OEMCP` без `unsafe` (F02 §1, запрос №3).
windows-registry.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
