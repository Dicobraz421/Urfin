# Базовый слой: привязки, общие для Far и DN (S3 §3). Пресеты добавляют свои.
# `ce` в таблицах S3 — флаг `cmdline_empty`. Контекст по умолчанию — `panel`.
# Команды других сессий, которых ещё нет в сборке, пропускаются при загрузке молча.
format = 1
name = "base"

# ---- §3.1 панели: навигация и вид ----
[context.panel]
"Up" = "panel.cursor.up"
"Down" = "panel.cursor.down"
"PageUp" = "panel.cursor.page_up"
"PageDown" = "panel.cursor.page_down"
"Home" = "panel.cursor.home"
"End" = "panel.cursor.end"
"Ctrl+PageDown" = "panel.enter"
"Ctrl+PageUp" = "panel.up"
"Ctrl+Backslash" = "panel.root"
"Tab" = "panel.switch"
"Ctrl+U" = "panel.swap"
"Ctrl+R" = "panel.refresh"
"Ctrl+F1" = { cmd = "panel.toggle", side = "left" }
"Ctrl+F2" = { cmd = "panel.toggle", side = "right" }
"Ctrl+P" = { cmd = "panel.toggle", side = "passive" }
"Ctrl+O" = "ui.panels.toggle_all"
"Ctrl+L" = { cmd = "panel.mode", mode = "info" }
"Ctrl+Q" = { cmd = "panel.mode", mode = "qview" }
"Ctrl+T" = { cmd = "panel.mode", mode = "tree" }
"Ctrl+1" = { cmd = "panel.view_mode", mode = "brief" }
"Ctrl+2" = { cmd = "panel.view_mode", mode = "medium" }
"Ctrl+3" = { cmd = "panel.view_mode", mode = "full" }
"Ctrl+4" = { cmd = "panel.view_mode", mode = "wide" }
"Alt+F1" = { cmd = "ui.drives", side = "left" }
"Alt+F2" = { cmd = "ui.drives", side = "right" }
"Alt+F12" = "ui.history.dirs"
# ---- §3.2 выделение и буфер обмена ----
"Insert" = { cmd = "sel.toggle", advance = true }
"Shift+Up" = { cmd = "sel.move", motion = "up" }
"Shift+Down" = { cmd = "sel.move", motion = "down" }
"Shift+PageUp" = { cmd = "sel.move", motion = "page_up" }
"Shift+PageDown" = { cmd = "sel.move", motion = "page_down" }
"Shift+Home" = { cmd = "sel.move", motion = "home" }
"Shift+End" = { cmd = "sel.move", motion = "end" }
# Маска — inline-черновиком S2 (ADR-0013).
"GrayPlus" = { cmd = "ui.draft", command = "sel.add", arg = "mask" }
"GrayMinus" = { cmd = "ui.draft", command = "sel.remove", arg = "mask" }
"GrayStar" = "sel.invert"
"Ctrl+GrayStar" = { cmd = "sel.invert", dirs = true }
# ---- §3.3 файловые операции, просмотр, правка ----
"F1" = "ui.help"
"F2" = "ui.user_menu"
"F3" = "viewer.open"
"Alt+F3" = { cmd = "viewer.open", alt = true }
"F4" = "editor.open"
"Alt+Shift+F4" = { cmd = "editor.open", alt = true }
"Shift+F4" = "editor.new"
"F5" = "ops.copy"
"F6" = "ops.move"
"F7" = "ops.mkdir"
"F8" = "ops.delete"
"Shift+F8" = { cmd = "ops.delete", current = true }
"Shift+Delete" = { cmd = "ops.delete", permanent = true }
"Ctrl+A" = "ops.attrs"
"Ctrl+I" = "panel.filter"
"Shift+F1" = "arc.add"
"Shift+F2" = "arc.extract"
"Alt+F7" = "search.files"
"Alt+F8" = "cmdline.history"
# ---- §3.5 табы, окно, приложение ----
"Ctrl+Tab" = "tab.next"
"Ctrl+Shift+Tab" = "tab.prev"
"Ctrl+Shift+P" = "ui.palette"

[context."panel && cmdline_empty"]
"Enter" = "panel.enter"
# «Мешочки» D-05: закладки (при наборе в cmdline Ctrl+D — его клавиша) и контекстное меню.
"Ctrl+D" = { cmd = "ui.menu", menu = "bookmarks" }
"Shift+F10" = { cmd = "ui.menu", menu = "context" }
# Urfin: Backspace — вверх и в Far (так проверено в S1-13; в DN — по таблице).
"Backspace" = "panel.up"
# Для клавиатур без Insert (как Space в колонке macOS).
"Space" = { cmd = "sel.toggle", advance = true }
"Ctrl+Insert" = { cmd = "ui.copy_names", full = false }
"Shift+Enter" = "file.reveal"

# ---- Дерево каталогов в панели (S2-18): стрелки и Enter — по дереву ----
[context."panel && tree && cmdline_empty"]
"Up" = "ui.tree.up"
"Down" = "ui.tree.down"
"PageUp" = "ui.tree.page_up"
"PageDown" = "ui.tree.page_down"
"Home" = "ui.tree.home"
"End" = "ui.tree.end"
"Right" = "ui.tree.expand"
"Left" = "ui.tree.collapse"
"Enter" = "ui.tree.enter"

# ---- §3.4 командная строка (S6): в панели и в cmdline ----
# `cmdline.del.*` — в S3 §3 `cmdline.delete.*`: `delete.word_right` длиннее 24 байт id (S1 §2.1).
[context."panel || cmdline"]
"Ctrl+Y" = "cmdline.clear"
"Ctrl+E" = "cmdline.history.prev"
"Ctrl+X" = "cmdline.history.next"
"Ctrl+Home" = "cmdline.home"
"Ctrl+End" = "cmdline.end"
"Ctrl+Backspace" = "cmdline.del.word_left"
"Ctrl+Delete" = "cmdline.del.word_right"
"Ctrl+K" = "cmdline.del.to_end"
"Ctrl+Enter" = { cmd = "cmdline.insert_name", what = "name" }
"Ctrl+OpenBracket" = { cmd = "cmdline.insert_name", what = "path", side = "left" }
"Ctrl+CloseBracket" = { cmd = "cmdline.insert_name", what = "path", side = "right" }
"Shift+Insert" = "cmdline.paste"
"Ctrl+V" = "cmdline.paste"

[context."(panel || cmdline) && !cmdline_empty"]
"Enter" = "cmdline.exec"
"Shift+Enter" = { cmd = "cmdline.exec", detached = true }
"Esc" = "cmdline.clear"
"Ctrl+Left" = "cmdline.word.left"
"Ctrl+Right" = "cmdline.word.right"
"Ctrl+Insert" = "cmdline.copy"
# Автокомплит (S6-17): пути, команды PATH, история.
"Tab" = "cmdline.complete"
# S6-15: при наборе Backspace и Del правят строку (Far); Ctrl+S/Ctrl+D — курсор.
"Backspace" = "cmdline.backspace"
"Delete" = "cmdline.delete"
"Ctrl+S" = "cmdline.cursor.left"
"Ctrl+D" = "cmdline.cursor.right"
"Ctrl+Z" = "cmdline.undo"
"Ctrl+Shift+Z" = "cmdline.redo"

# ---- Командная строка за спрятанными панелями (Ctrl+O, вид transcript) ----
[context.cmdline]
"Left" = "cmdline.cursor.left"
"Right" = "cmdline.cursor.right"
"Home" = "cmdline.home"
"End" = "cmdline.end"
"Backspace" = "cmdline.backspace"
"Delete" = "cmdline.delete"
"Enter" = "cmdline.exec"

# ---- Терминал (ADR-0015, S6-08): только свои привязки, остальное — в PTY ----
[context.terminal]
"Ctrl+O" = "ui.panels.toggle_all"
# Буфер и прокрутка (S6-07, S6 §3.4); Ctrl+C с выделением копирует (`term.key`).
"Ctrl+Shift+C" = "term.copy"
"Ctrl+Insert" = "term.copy"
"Ctrl+Shift+V" = "term.paste"
"Shift+Insert" = "term.paste"
"Shift+PageUp" = { cmd = "term.scroll", pages = -1 }
"Shift+PageDown" = { cmd = "term.scroll", pages = 1 }

# ---- §3.6 быстрый поиск (S3) ----
[context."overlay && qs"]
"Ctrl+Enter" = "keymap.qs.next"
"Down" = "keymap.qs.next"
"Up" = "keymap.qs.prev"
"Backspace" = "keymap.qs.backspace"
"Esc" = "keymap.qs.cancel"

# ---- §3.9 оверлеи S2 (запросы разбирают клавиши сами) ----
[context.overlay]
"Esc" = "ui.cancel"

# ---- §3.7 просмотр (S7) ----
[context.viewer]
"Esc" = "viewer.close"
"F10" = "viewer.close"
"F2" = "viewer.wrap"
"F4" = "viewer.hex"
"F7" = "viewer.search"
"Shift+F7" = "viewer.search_next"
"Alt+F7" = "viewer.search_prev"
"Up" = { cmd = "viewer.scroll", dir = "up" }
"Down" = { cmd = "viewer.scroll", dir = "down" }
"Left" = { cmd = "viewer.scroll", dir = "left" }
"Right" = { cmd = "viewer.scroll", dir = "right" }
"PageUp" = { cmd = "viewer.scroll", dir = "page_up" }
"PageDown" = { cmd = "viewer.scroll", dir = "page_down" }
"Home" = { cmd = "viewer.scroll", dir = "home" }
"End" = { cmd = "viewer.scroll", dir = "end" }

# ---- §3.8 редактор (S7); базовую правку keymap не трогает ----
[context.editor]
"F2" = "editor.save"
"Shift+F2" = "editor.save_as"
"Esc" = "editor.close"
"F7" = "editor.search"
"Ctrl+F7" = "editor.replace"
"Shift+F7" = "editor.search_next"
"Alt+F7" = "editor.search_prev"
"Ctrl+Y" = "editor.delete_line"

# ---- Список над cmdline: история Alt+F8, варианты Tab (S6-16, S6-17) ----
# `!overlay && !prompt` — вес выше «panel && tree && cmdline_empty»: список главнее.
[context."(panel || cmdline) && cmdline_menu && !overlay && !prompt"]
"Up" = "cmdline.menu.up"
"Down" = "cmdline.menu.down"
"PageUp" = "cmdline.menu.page_up"
"PageDown" = "cmdline.menu.page_down"
"Enter" = "cmdline.menu.accept"
"Shift+Enter" = { cmd = "cmdline.menu.accept", exec = true }
"Delete" = "cmdline.menu.delete"
"Insert" = "cmdline.menu.lock"
"Ctrl+R" = "cmdline.menu.scope"
"Esc" = "cmdline.menu.close"
"Tab" = "cmdline.complete"
"Shift+Tab" = "cmdline.menu.up"
"Backspace" = "cmdline.backspace"
"Space" = { cmd = "cmdline.insert", text = " " }

# ---- Ghost-текст из истории (S6 §6.2): → и End принимают его ----
[context."(panel || cmdline) && cmdline_ghost"]
"Right" = "cmdline.cursor.right"
"End" = "cmdline.end"

# ---- macOS: Ctrl+F1…F8 и Ctrl+стрелки заняты системой (S3 §4) ----
[os.macos.context."*"]
"Ctrl+F1" = false
"Ctrl+F2" = false
"Ctrl+F7" = false
"Ctrl+Left" = false
"Ctrl+Right" = false

[os.macos.context.panel]
"Ctrl+Cmd+1" = { cmd = "panel.toggle", side = "left" }
"Ctrl+Cmd+2" = { cmd = "panel.toggle", side = "right" }
"Cmd+Down" = "panel.enter"
"Cmd+Up" = "panel.up"
"Cmd+R" = "panel.refresh"
"Cmd+Shift+C" = "ui.drives"
"Cmd+Shift+G" = "ui.path_edit"
"Cmd+Shift+Equals" = { cmd = "ui.draft", command = "sel.add", arg = "mask" }
"Cmd+Shift+Minus" = { cmd = "ui.draft", command = "sel.remove", arg = "mask" }
"Cmd+Shift+8" = "sel.invert"
"Cmd+Alt+Shift+8" = { cmd = "sel.invert", dirs = true }
"Cmd+Shift+Slash" = "ui.help"
"Cmd+Y" = "viewer.open"
"Alt+F4" = { cmd = "editor.open", alt = true }
"Cmd+Shift+N" = "ops.mkdir"
"Cmd+Backspace" = "ops.delete"
"Cmd+Alt+Backspace" = { cmd = "ops.delete", permanent = true }
"Cmd+I" = "ops.attrs"
"Cmd+F" = "search.files"
"Cmd+Shift+P" = "ui.palette"
"Cmd+Q" = "app.quit"
"Cmd+M" = "ui.window.minimize"
"Cmd+H" = "ui.window.hide"
"Cmd+Equals" = { cmd = "ui.zoom", delta = 1 }
"Cmd+Minus" = { cmd = "ui.zoom", delta = -1 }
"Cmd+0" = "ui.zoom"

[os.macos.context."panel && cmdline_empty"]
"Cmd+C" = "file.clip.copy"
"Cmd+V" = "file.clip.paste"

[os.macos.context."panel || cmdline"]
"Cmd+Left" = "cmdline.home"
"Cmd+Right" = "cmdline.end"
"Alt+Delete" = "cmdline.del.word_right"

[os.macos.context."(panel || cmdline) && !cmdline_empty"]
"Alt+Left" = "cmdline.word.left"
"Alt+Right" = "cmdline.word.right"
"Cmd+V" = "cmdline.paste"
"Cmd+C" = "cmdline.copy"

[os.macos.context.viewer]
"Cmd+W" = "viewer.close"
"Cmd+F" = "viewer.search"
"Cmd+G" = "viewer.search_next"
"Cmd+Shift+G" = "viewer.search_prev"
"Cmd+L" = "viewer.goto"

[os.macos.context.editor]
"Cmd+S" = "editor.save"
"Cmd+Shift+S" = "editor.save_as"
"Cmd+W" = "editor.close"
"Cmd+F" = "editor.search"
"Cmd+Alt+F" = "editor.replace"
"Cmd+G" = "editor.search_next"
"Cmd+Shift+G" = "editor.search_prev"
"Cmd+L" = "editor.goto"
"Cmd+Z" = "editor.undo"
"Cmd+Shift+Z" = "editor.redo"
"Cmd+Shift+K" = "editor.delete_line"

# ---- Linux (tier 2): Alt+F1/F2/F7/F8/F10 и Ctrl+Alt+F* у оконного менеджера ----
[os.linux.context."*"]
"Alt+F1" = false
"Alt+F2" = false
"Alt+F7" = false
"Alt+F8" = false

[os.linux.context.panel]
"Alt+Shift+F1" = { cmd = "ui.drives", side = "left" }
"Alt+Shift+F2" = { cmd = "ui.drives", side = "right" }
"Alt+Shift+F7" = "search.files"
"Alt+Shift+F8" = "cmdline.history"

[os.linux.context.viewer]
"Alt+Shift+F7" = "viewer.search_prev"

[os.linux.context.editor]
"Alt+Shift+F7" = "editor.search_prev"
