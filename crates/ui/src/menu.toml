# Меню F9 (S2 §2.6, S2-14). Переопределяется файлом `menu.toml` в каталоге конфига.
#
# Меню: `id`, `title` — ключ Fluent заголовка, `side` — меню панели: перед командой
# пункта панель становится активной (`panel.focus`).
# Пункт: `cmd` — команда с аргументами (список и аргументы — docs/COMMANDS.md);
# `label` — ключ Fluent подписи
# (по умолчанию `cmd-<id>`); буква выбора — атрибут `.menu-key` подписи, иначе первая
# буква. `sep = true` — разделитель. Пункт с незарегистрированной командой скрыт,
# с предупреждением.

[[menu]]
id = "left"
title = "menu-left"
side = "left"
items = [
    { cmd = "panel.view_mode mode=brief", label = "menu-view-brief" },
    { cmd = "panel.view_mode mode=medium", label = "menu-view-medium" },
    { cmd = "panel.view_mode mode=full", label = "menu-view-full" },
    { cmd = "panel.view_mode mode=wide", label = "menu-view-wide" },
    { sep = true },
    { cmd = "panel.sort key=name", label = "menu-sort-name" },
    { cmd = "panel.sort key=ext", label = "menu-sort-ext" },
    { cmd = "panel.sort key=mtime", label = "menu-sort-mtime" },
    { cmd = "panel.sort key=size", label = "menu-sort-size" },
    { sep = true },
    { cmd = "panel.hidden.toggle" },
    { cmd = "panel.refresh" },
    { cmd = "ui.path_edit" },
]

[[menu]]
id = "files"
title = "menu-files"
# Порядок — как в `screen-menu.png` (D-05); F3/F4 — с S7 (viewer.open, editor.open).
items = [
    { cmd = "ops.copy" },
    { cmd = "ops.move" },
    { cmd = "ops.mkdir" },
    { cmd = "ops.delete" },
    { cmd = "ui.rename" },
    { cmd = "ops.multi_rename" },
    { sep = true },
    { cmd = "ui.draft command=sel.add arg=mask", label = "menu-sel-add" },
    { cmd = "ui.draft command=sel.remove arg=mask", label = "menu-sel-remove" },
    { cmd = "sel.invert" },
    { cmd = "sel.all" },
    { cmd = "sel.none" },
    { cmd = "sel.restore" },
    { sep = true },
    { cmd = "ops.attrs" },
    { cmd = "ops.compare" },
]

[[menu]]
id = "commands"
title = "menu-commands"
items = [
    { cmd = "panel.swap" },
    { cmd = "ui.panels.toggle_all" },
    { sep = true },
    { cmd = "panel.back" },
    { cmd = "panel.forward" },
    { sep = true },
    { cmd = "tab.new" },
    { cmd = "tab.dup" },
    { cmd = "tab.close" },
    { sep = true },
    { cmd = "vfs.dir_size" },
    { cmd = "ops.compare" },
    { cmd = "ops.sync dir=lr", label = "menu-sync-lr" },
    { cmd = "ops.sync dir=rl", label = "menu-sync-rl" },
]

[[menu]]
id = "utilities"
title = "menu-utilities"
# Ctrl+F9 открывает меню сразу здесь (№83, `screen-utilmenu.png`).
items = [
    { cmd = "du.open" },
]

