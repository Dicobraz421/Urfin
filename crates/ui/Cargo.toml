[package]
name = "urfin-ui"
description = "Urfin GPUI frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
compact_str.workspace = true
# Цвета токенов (премультиплицированный sRGB), без egui.
ecolor.workspace = true
gpui-kit.workspace = true
futures.workspace = true
urfin-core.workspace = true
urfin-i18n.workspace = true
urfin-keymap.workspace = true
urfin-term.workspace = true
urfin-view.workspace = true
urfin-vfs.workspace = true
rustc-hash.workspace = true
serde.workspace = true
smallvec.workspace = true
# Меню F9: `menu.toml` (S2-14).
toml.workspace = true
dirs.workspace = true
tracing.workspace = true

# Даты: на Windows — API ОС (S0-decisions 2026-10-17), иначе jiff по zoneinfo.
[target.'cfg(not(windows))'.dependencies]
jiff.workspace = true

# PNG снимков `--screens` (уже в графе через gpui), MIT OR Apache-2.0.
[dependencies.png]
version = "0.18"

[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
insta.workspace = true
tempfile.workspace = true
urfin-core = { workspace = true, features = ["fake"] }
urfin-ops.workspace = true

[lints]
workspace = true

[[bench]]
name = "highlight"
harness = false
