[package]
name = "urfin-term"
description = "Urfin terminal and command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
alacritty_terminal.workspace = true
base64.workspace = true
crossbeam-channel.workspace = true
compact_str = { workspace = true, features = ["serde"] }
serde.workspace = true
toml.workspace = true
tracing.workspace = true
urfin-core.workspace = true
urfin-i18n.workspace = true

# ConPTY, job object, ожидание выхода (S6-02).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[[bench]]
name = "pipeline"
harness = false

# S6-22: e2e-замеры на стенде (простой и память 3 сеансов, поток `type`, `dir /s`).
[[example]]
name = "term_e2e"
