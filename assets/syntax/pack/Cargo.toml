# Пакет грамматики Урфина (S7-21a, S7 §5.7): одна DLL на язык — `grammars\<язык>.dll` рядом с
# `urfin.exe`. Отдельный workspace: в сборку exe и в CI не входит. Сборка — см. `src/lib.rs`.
[workspace]

[package]
name = "urfin-grammar"
version = "1.0.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tree-sitter-language = "0.1.9"
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-css = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-powershell = { version = "0.26.6", optional = true }
tree-sitter-diff = { version = "0.1", optional = true }
tree-sitter-make = { version = "1.1.1", optional = true }
tree-sitter-cmake = { version = "0.7.6", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }

# Ровно один язык на сборку: имя фичи = имя языка `urfin_view::lang` = имя DLL.
[features]
html = ["dep:tree-sitter-html"]
css = ["dep:tree-sitter-css"]
javascript = ["dep:tree-sitter-javascript"]
python = ["dep:tree-sitter-python"]
powershell = ["dep:tree-sitter-powershell"]
diff = ["dep:tree-sitter-diff"]
make = ["dep:tree-sitter-make"]
cmake = ["dep:tree-sitter-cmake"]
lua = ["dep:tree-sitter-lua"]
rust = ["dep:tree-sitter-rust"]
c = ["dep:tree-sitter-c"]
go = ["dep:tree-sitter-go"]
java = ["dep:tree-sitter-java"]
bash = ["dep:tree-sitter-bash"]
cpp = ["dep:tree-sitter-cpp", "dep:tree-sitter-c"]
csharp = ["dep:tree-sitter-c-sharp"]
typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
tsx = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"
