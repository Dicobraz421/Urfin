# cargo-deny: лицензии, advisories, дубли версий, источники (S1 §3, S1-02).

[graph]
all-features = false

[advisories]
yanked = "deny"
# «Unmaintained» (не уязвимости) в транзитивных зависимостях gpui-kit 0.7.3 (ADR-0018,
# G-01): уйдут с обновлением снимка GPUI. rustls-pemfile — только wasm-сборка
# gpui-kit-assets; zbus/zvariant — Linux (D-Bus).
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant: gpui-base" },
    { id = "RUSTSEC-2024-0436", reason = "paste: gpui-component, metal" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: reqwest only on wasm" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: gpui text on Linux" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: gpui text on Linux" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: gpui Linux D-Bus" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: gpui Linux D-Bus" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: gpui Linux D-Bus" },
    # RSA-ключи SSH (F03 §2.5): клиент только подписывает при входе и проверяет подписи
    # сервера, расшифровки RSA нет. Снять, когда rsa исправят
    # (docs/decisions/2026-11-01-rsa-advisory.md).
    { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin): russh client signs and verifies only, no decryption" },
]

[licenses]
# S1 §3 + BSD-3-Clause (S0 v5, «Зависимости и политика»: encoding_rs).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    # Решение владельца 2026-10-15 (S1-10): `dirs` → `option-ext`. Пофайловый copyleft,
    # используем без изменений.
    "MPL-2.0",
]
confidence-threshold = 0.9
# Список — политика проекта, а не перечень текущих зависимостей.
unused-allowed-license = "allow"
exceptions = [
    # GPUI (ADR-0018, G-01): транзитивные зависимости gpui-kit — public domain / 0BSD.
    { crate = "enum-iterator", allow = ["0BSD"] },
    { crate = "enum-iterator-derive", allow = ["0BSD"] },
    { crate = "hexf-parse", allow = ["CC0-1.0"] },
    { crate = "notify", allow = ["CC0-1.0"] },
    { crate = "tiny-keccak", allow = ["CC0-1.0"] },
    # Архивы (S8-20, решение 2026-11-08 «arc-licenses»): bz2-декодер на Rust (zip, 7z, tar.bz2)
    # и PPMd (zip, 7z). Разрешительные лицензии, только эти крейты.
    { crate = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
    { crate = "ppmd-rust", allow = ["MIT-0"] },
    # RAR (№37, решение 2026-11-11 «rar»): только распаковка; текст лицензии — THIRD_PARTY.md.
    { crate = "unrar_sys", allow = ["LicenseRef-UnRAR"] },
]

# Метаданные `unrar_sys` — `MIT OR Apache-2.0`, но внутри — C++ UnRAR под своей лицензией
# (vendor/unrar/license.txt): без уточнения cargo-deny её не видит.
[[licenses.clarify]]
crate = "unrar_sys"
expression = "LicenseRef-UnRAR"
license-files = []

[bans]
# Дубли версий в графе gpui неизбежны (windows-sys, syn и др.) — предупреждение.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Патч Windows-платформы gpui (ADR-0018, G-02) — наш репозиторий pets.
allow-git = ["https://github.com/Dicobraz421/pets"]
