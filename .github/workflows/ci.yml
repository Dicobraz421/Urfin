# CI Урфина по шаблону pets-dev. PR и merge queue: ≤7 мин (fmt, deny, полосы — на ubuntu
# параллельно с clippy и nextest на Windows). Docs-PR: сборка пропускается.
# Release, размер, smoke, артефакт — только main, бета (`beta-*`) и ручной запуск.
# Required check в защите main — один: `gate`. Только Windows (решение владельца 2026-10-20).
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ['beta-*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.d.outputs.rust }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: d
        name: Что изменилось
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$BASE" ]; then echo rust=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only "$BASE" HEAD > changed.txt
          # Полосы: PR правит одну полосу (x/* — межполосный PR класса B).
          if [ -f lanes.toml ] && [ "$EVENT" = pull_request ]; then
            python3 .github/lane_check.py lanes.toml changed.txt "$HEAD_REF"
          fi
          if grep -qvE '^(docs/|[^/]*\.md$|.*/README\.md$)' changed.txt; then
            echo rust=true >> "$GITHUB_OUTPUT"
          else
            echo rust=false >> "$GITHUB_OUTPUT"
          fi

  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if [[ "$TITLE" =~ $re ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::Заголовок PR не в формате Conventional Commits: 'type(scope)?: описание', например 'feat(core): base types'. Получено: '$TITLE'"
            exit 1
          fi

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install && cargo fmt --all --check

  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: test (windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      # Ставит тулчейн из rust-toolchain.toml (rustup ≥1.28 не делает этого в `rustup show`).
      - run: rustup toolchain install && rustup show
      # Кэш пишет только main: PR и очередь берут тёплый кэш main.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-nextest
      # `--all-targets` проверяет и бенчи (S1-14); их числа — на стенде (docs/perf/).
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Тесты с настоящей корзиной (S5-13) — только на раннере CI: на стенде
      # владельца они клали бы файлы в его корзину.
      - run: cargo nextest run --workspace --locked --profile ci
        env:
          URFIN_TEST_RECYCLE: "1"
      - run: cargo test --doc --workspace --locked

  # Только main, бета и ручной запуск: release (fat LTO), размер, smoke, артефакт.
  release:
    needs: [changes, test]
    if: >-
      always() && needs.test.result != 'failure' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install && rustup show
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: windows-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Python
        run: echo "PY=$(command -v python3 || command -v python)" >> "$GITHUB_ENV"
      # Каталог сборки — из cargo metadata, не `target/` (H-01: CARGO_TARGET_DIR может быть общим).
      - name: Target dir
        run: |
          T=$(cargo metadata --format-version 1 --no-deps | "$PY" -c 'import json,sys; print(json.load(sys.stdin)["target_directory"].replace("\\", "/"))')
          echo "BIN=$T/release/urfin.exe" >> "$GITHUB_ENV"
      - name: No diagnostic features in release (profile, dhat-heap, count-alloc)
        run: $PY ci/release_features.py
      - run: cargo build --release -p urfin-app --locked
      # Бюджет 30 МиБ (S0-decisions №80, растёт вместе с функциями), блокирующий.
      - name: Binary size ≤ 30 MB
        run: $PY ci/size.py "$BIN" 30
      - name: Smoke
        run: '"$BIN" --smoke'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: urfin-Windows
          path: ${{ env.BIN }}

  # Единственный required check: зелёный, если всё нужное прошло или было пропущено.
  gate:
    needs: [changes, pr-title, fmt, deny, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          r='${{ join(needs.*.result, ' ') }}'
          echo "$r"
          case " $r " in *" failure "*|*" cancelled "*) exit 1;; esac
