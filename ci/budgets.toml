# Реестр бюджетов Урфина (S9-06, S9 §2). Проверка прогона: python ci/perf_check.py <run.json>.
#
# Поля строки [[budget]]:
#   id        — строка §2 (S.1 … O.18); case — подслучай, если значений несколько;
#   what      — что меряется; value, unit, op ("<", "<=", ">=", ">") — бюджет;
#   check     — где проверяется: stand | ci-abs | ci-instr | ci-ab; where — подробности из §2;
#   threshold — порог регрессии по §2 «Пороги» (для stand — медиана хуже базы при CV ≤ 5 %);
#   source    — откуда значение (спека, решение);
#   metric    — ключ результата прогона perf.py (<сценарий>/<инструмент>/<метрика>, медиана);
#   ratio     — [числитель, знаменатель]: «во сколько раз» (конкурент / Urfin).
# Строки без metric/ratio харнесс пока не мерит: perf_check печатает их как «не мерено».
# macOS и Linux не заводятся (S0 №57); поправки — решения владельца в source.

